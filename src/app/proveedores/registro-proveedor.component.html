<div class="registro-proveedor-container">
  <h2>Registro de proveedores</h2>

  <form #proveedorForm="ngForm">
    <div class="form-section">
      <div class="form-group">
        <label for="empresaProveedor">Empresa del proveedor</label>
        <input
          type="text"
          id="empresaProveedor"
          [(ngModel)]="nombreProveedor"
          name="nombreProveedor"
          required
          pattern="^[a-zA-Z0-9\\s]*$"
          title="Solo se permiten letras, números y espacios."
        />
      </div>

      <div class="form-group">
        <label for="nombreContacto">Nombre del contacto</label>
        <input
          type="text"
          id="nombreContacto"
          [(ngModel)]="nombreContacto"
          name="nombreContacto"
          required
          pattern="^[a-zA-Z\\s]*$"
          title="Solo se permiten letras y espacios."
        />
      </div>
    </div>

    <!-- Contacto -->
    <h3>Contacto</h3>
    <div class="form-section">
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input
          type="text"
          id="telefono"
          [(ngModel)]="telefono"
          name="telefono"
          required
          pattern="^[0-9+\\-\\s]{7,20}$"
          title="Ingresa un teléfono válido (7-20 caracteres, números, +, - y espacios)"
        />
      </div>

      <div class="form-group">
        <label for="correo">Email</label>
        <input
          type="email"
          id="correo"
          [(ngModel)]="correo"
          name="correo"
          required
          title="Ingresa un correo válido"
        />
      </div>
    </div>

    <h3>Dirección</h3>
    <div class="componentes-list">
      <div class="component-item">
        <div class="form-group">
          <label for="calle">Calle</label>
          <input type="text" id="calle" [(ngModel)]="calle" name="calle" />
        </div>

        <div class="form-group">
          <label for="numero">Número</label>
          <input type="text" id="numero" [(ngModel)]="numero" name="numero" />
        </div>

        <div class="form-group">
          <label for="colonia">Colonia</label>
          <input type="text" id="colonia" [(ngModel)]="colonia" name="colonia" />
        </div>

        <div class="form-group">
          <label for="ciudad">Ciudad</label>
          <input type="text" id="ciudad" [(ngModel)]="ciudad" name="ciudad" />
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <input type="text" id="estado" [(ngModel)]="estado" name="estado" />
        </div>

        <div class="form-group">
          <label for="cp">Código Postal</label>
          <input
            type="text"
            id="cp"
            [(ngModel)]="codigoPostal"
            name="codigoPostal"
            pattern="^[0-9A-Za-z\\-]{4,10}$"
            title="Entre 4 y 10 caracteres"
          />
        </div>

        <div class="form-group">
          <label for="pais">País</label>
          <input type="text" id="pais" [(ngModel)]="pais" name="pais" />
        </div>
      </div>
    </div>

    <h3>Componentes</h3>
    <div class="componentes-list">
      <div *ngFor="let componente of componentes; let i = index" class="component-item">
        <div class="form-group">
          <label for="nombreComponente{{i}}">Nombre del componente</label>
          <input
            type="text"
            id="nombreComponente{{i}}"
            [(ngModel)]="componente.nombreComponente"
            name="nombreComponente{{i}}"
            required
            pattern="^[a-zA-Z0-9\\s]*$"
            title="Solo se permiten letras, números y espacios."
          />
        </div>

        <div class="form-group">
          <label for="descripcion{{i}}">Descripción</label>
          <input
            type="text"
            id="descripcion{{i}}"
            [(ngModel)]="componente.descripcion"
            name="descripcion{{i}}"
            required
            pattern="^[a-zA-Z0-9\\s.,]*$"
            title="Solo se permiten letras, números, espacios y los caracteres especiales . y ,"
          />
        </div>

        <div class="form-group">
          <label for="precioCompra{{i}}">Precio de compra</label>
          <input
            type="number"
            id="precioCompra{{i}}"
            [(ngModel)]="componente.precio"
            name="precioCompra{{i}}"
            required
            min="0.01"
            step="0.01"
            title="El precio debe ser mayor a 0."
          />
        </div>

        <div class="form-group">
          <label for="cantidadIngresada{{i}}">Cantidad ingresada</label>
          <input
            type="number"
            id="cantidadIngresada{{i}}"
            [(ngModel)]="componente.cantidad"
            name="cantidadIngresada{{i}}"
            required
            min="1"
            step="1"
            title="Solo se permiten números enteros mayores a 0."
          />
        </div>

        <div class="action-buttons">
          <button type="button" (click)="agregarComponente()" class="btn btn-add">
            <i class="fas fa-plus"></i>
          </button>
          <button
            type="button"
            (click)="eliminarComponente(i)"
            class="btn btn-remove"
            *ngIf="componentes.length > 1"
          >
            <i class="fas fa-minus"></i>
          </button>
        </div>
      </div>
    </div>

    <button
      type="button"
      (click)="registrarProveedor()"
      class="btn btn-primary-submit"
      [disabled]="!proveedorForm.valid"
    >
      Guardar
    </button>
  </form>
</div>
